# Material properties for additively manufactured PLA (Fused Deposition Modeling - FDM)
# Experimental analogue material for laboratory testing and kinematic/acoustic validation
# Standards: ASTM D638 (Tensile Properties of Plastics), ASTM D695 (Compressive Properties)
# Reference: Chacón et al. (2017), UESC TCC Experimental Framework (Gabriel Marques de Andrade)

material:
  name: "Polylactic Acid (PLA)"
  process: "Fused Deposition Modeling (FDM / FFF)"
  nozzle_diameter_mm: 0.4
  layer_height_mm: 0.2
  infill_density_percent: 100.0
  raster_angle_deg: [0, 90]
  density_kg_m3: 1250.0             # rho_s solid filament

elastic_properties_isotropic_analogue:
  young_modulus_gpa: 3.5            # E_s nominal
  poisson_ratio: 0.36               # nu_s
  shear_modulus_gpa: 1.28           # G_s

strength_limits:
  yield_strength_mpa: 50.0          # sigma_y (nominal compression/tension)
  ultimate_tensile_strength_mpa: 60.0
  elongation_at_break_percent: 6.0

orthotropic_estimates_by_build_orientation:
  flat_0_deg:
    young_modulus_gpa: 3.65
    yield_strength_mpa: 54.0
  on_edge_45_deg:
    young_modulus_gpa: 3.20
    yield_strength_mpa: 48.0
  vertical_90_deg: # Inter-layer critical direction
    young_modulus_gpa: 2.85
    yield_strength_mpa: 38.0

testing_campaign:
  specimen_standard: "ASTM D638 Type IV / ASTM D695 Cylindrical"
  planned_replicates: 5
  testing_machine: "Universal Testing Machine (EMIC / Instron)"
  crosshead_speed_mm_min: 1.0
